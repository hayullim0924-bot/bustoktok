<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#175bd7"><title>버스톡톡 | BUS TOKTOK</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182943;font-family:Arial,"Noto Sans KR",sans-serif}
header{height:68px;background:white;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 1100px)/2))}
.brand{font-size:21px;font-weight:800;color:#17345e}.health{font-size:12px;padding:8px 12px;border-radius:20px;background:#fff0d4;color:#875b00}
main{max-width:1100px;margin:35px auto;padding:0 18px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center;margin-bottom:25px}
h1{font-size:36px;line-height:1.35;margin:0;color:#16345e}h1 span{color:#175bd7}.muted{color:#73829a;font-size:14px;line-height:1.7}
.panel{background:white;border:1px solid #e6ebf3;border-radius:15px;padding:20px;box-shadow:0 8px 24px #1b3d6b0a}
.tabs{display:flex;gap:16px;margin-bottom:15px}.tab{border:0;background:none;padding:8px 2px;color:#7c8ba2;font-weight:bold}.tab.active{color:#175bd7;border-bottom:2px solid #175bd7}
.row{display:flex;gap:8px}.row input,.row select{min-width:0;height:46px;border:1px solid #dce4ef;border-radius:8px;padding:0 11px;font-size:14px}.row input{flex:1}.row select{max-width:130px}
button{cursor:pointer}.primary{background:#175bd7;color:white;border:0;border-radius:8px;padding:0 18px;font-weight:bold}
.content{display:grid;grid-template-columns:1fr 1fr;gap:18px}.results{min-height:230px;max-height:480px;overflow:auto}.item{padding:13px 4px;border-bottom:1px solid #edf0f5;cursor:pointer}.item b{display:block}.item small{color:#8290a5}.status{font-size:12px;color:#687b97;background:#f4f7fc;padding:10px;border-radius:8px;margin:12px 0}
#map{height:380px;border-radius:10px}.empty{padding:45px 10px;text-align:center;color:#7c8ba2}.item button{margin-top:8px}
footer{text-align:center;color:#8b98aa;font-size:11px;padding:28px}
@media(max-width:760px){.hero,.content{grid-template-columns:1fr}h1{font-size:30px}#map{height:290px}.row{flex-wrap:wrap}.row select{max-width:none;width:100%}.row input{width:calc(100% - 85px);flex:none}.primary{height:46px;flex:1}}
</style></head><body>
<header><div class="brand">🚌 버스톡톡 <small style="font-size:9px;letter-spacing:1px;color:#8190a6">BUS TOKTOK</small></div><span id="health" class="health">서버 확인 중</span></header>
<main><section class="hero"><div><p style="color:#8a9ab0;font-size:11px;font-weight:bold;letter-spacing:2px">KOREA BUS INFORMATION</p><h1>버스가 궁금할 땐,<br><span>버스톡톡</span></h1><p class="muted">전국 버스 노선과 정류장 정보를 검색하고<br>정류장별 도착정보와 차량 위치를 확인하세요.</p></div>
<div class="panel"><div class="tabs"><button class="tab active" data-type="route">노선 검색</button><button class="tab" data-type="station">정류장 검색</button></div><div class="row"><select id="city"><option value="">전국</option></select><input id="q" placeholder="버스 번호 또는 노선명"><button id="search" class="primary">검색</button></div><p class="muted" style="font-size:11px;margin-bottom:0">전국 검색은 지역별 공공데이터 제공 범위에 따라 결과가 다를 수 있습니다.</p></div></section>
<section class="content"><div class="panel"><b id="resultTitle">검색 결과</b><div id="status" class="status">검색어를 입력해 주세요.</div><div id="results" class="results"><div class="empty">🚌<br>버스 정보를 검색해 보세요.</div></div></div><div class="panel"><b>정류장 지도</b><p class="muted" style="font-size:11px">정류장 결과 또는 내 주변 정류장을 지도에 표시합니다.</p><div id="map"></div><button id="nearby" class="primary" style="height:40px;margin-top:12px">내 주변 정류장 찾기</button></div></section></main>
<footer>버스톡톡 · 공공데이터포털 TAGO 연동 · 실제 제공 범위는 지역별로 다를 수 있습니다.</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let type="route",map,markers=[];
const $=id=>document.getElementById(id);
map=L.map("map").setView([36.5,127.8],7);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
function clearMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[]}
function setStatus(t){$("status").textContent=t}
async function api(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw new Error(d.error||"요청 실패");return d}
async function health(){try{const d=await api("/api/health");$("health").textContent=d.keyConfigured?"API 연결 준비됨":"인증키 설정 필요";$("health").style.background=d.keyConfigured?"#e2f8eb":"#fff0d4";$("health").style.color=d.keyConfigured?"#168044":"#875b00"}catch(e){$("health").textContent="서버 오류"}}
async function loadCities(){try{const d=await api("/api/cities");d.items.forEach(c=>{let o=document.createElement("option");o.value=c.cityCode;o.textContent=c.cityName;$("city").appendChild(o)})}catch(e){setStatus(e.message)}}
function val(x,names){for(const n of names)if(x[n]!==undefined&&x[n]!==null&&x[n]!=="")return x[n];return ""}
function render(items){$("results").innerHTML="";clearMarkers();if(!items.length){$("results").innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}
items.forEach(x=>{const name=type==="route"?val(x,["routeNo"]):val(x,["nodeName"]);const sub=type==="route"?[val(x,["startNode"]),val(x,["endNode"])].filter(Boolean).join(" → "):"정류장 번호 "+val(x,["nodeNo"]);const el=document.createElement("div");el.className="item";const b=document.createElement("b");b.textContent=type==="route"?(name+"번 노선"):name;const sm=document.createElement("small");sm.textContent=sub||"상세 정보";el.append(b,sm);el.onclick=()=>detail(x);$("results").appendChild(el);
if(type==="station"){const lat=Number(x.gpsLati),lng=Number(x.gpsLong);if(Number.isFinite(lat)&&Number.isFinite(lng)&&lat&&lng){const m=L.marker([lat,lng]).addTo(map).bindPopup(String(name));markers.push(m)}}});
if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.2))}
async function search(){const q=$("q").value.trim();if(!q){setStatus("검색어를 입력해 주세요.");return}setStatus("공공데이터 검색 중…");$("results").innerHTML="";try{const d=await api(`/api/search?type=${type}&q=${encodeURIComponent(q)}&cityCode=${encodeURIComponent($("city").value)}`);setStatus(`${d.count}건 검색됨`);render(d.items)}catch(e){setStatus(e.message)}}
async function detail(x){if(type==="route"){setStatus("노선 경유 정류장 정보를 불러오는 중…");try{const d=await api(`/api/route/${encodeURIComponent(x.cityCode)}/${encodeURIComponent(x.routeId)}/stops`);const rows=d.items.map(s=>val(s,["nodenm","nodeNm","NODE_NM"])||"정류장").join(" · ");alert("노선 경유 정류장\\n"+(rows||"제공되는 상세 정보가 없습니다."))}catch(e){alert(e.message)}}else{setStatus("도착정보를 불러오는 중…");try{const d=await api(`/api/station/${encodeURIComponent(x.cityCode)}/${encodeURIComponent(x.nodeId)}/arrivals`);if(!d.items.length){alert("현재 도착정보가 없습니다.")}else{alert(d.items.map(a=>`${val(a,["routeno","routeNo"])}번 · ${val(a,["arrtime","arrTime"])}초 후 도착`).join("\\n"))}setStatus("도착정보 조회 완료")}catch(e){alert(e.message);setStatus(e.message)}}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));$("q").placeholder=type==="route"?"버스 번호 또는 노선명":"정류장 이름";$("resultTitle").textContent=type==="route"?"노선 검색 결과":"정류장 검색 결과"});
$("search").onclick=search;$("q").onkeydown=e=>{if(e.key==="Enter")search()};
$("nearby").onclick=()=>{if(!navigator.geolocation){setStatus("위치 기능을 사용할 수 없습니다.");return}setStatus("현재 위치 확인 중…");navigator.geolocation.getCurrentPosition(async p=>{try{const d=await api(`/api/nearby?lat=${p.coords.latitude}&lng=${p.coords.longitude}&radius=700`);type="station";render(d.items);setStatus(`주변 정류장 ${d.items.length}곳`);if(d.items.length){const first=d.items[0];map.setView([Number(first.gpsLati),Number(first.gpsLong)],15)}}catch(e){setStatus(e.message)}},()=>setStatus("위치 권한을 허용하고 HTTPS 주소에서 다시 시도해 주세요."),{enableHighAccuracy:true,timeout:12000})};
health();loadCities();
</script></body></html>
